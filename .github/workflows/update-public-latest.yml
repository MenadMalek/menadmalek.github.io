name: Mise à jour publique temporaire

on:
  push:
    paths:
      - '.github/workflows/update-public-latest.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer la dernière version publique
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('index.html','utf8');
          const css=`\n<style>\n.license-notice{\n  max-width:1100px;\n  margin:18px auto 8px;\n  padding:10px 16px;\n  text-align:center;\n  font-size:11px;\n  line-height:1.45;\n  color:#6b6870;\n}\n.license-notice a{color:inherit;text-decoration:underline}\n@media print{.license-notice{display:none!important}}\n</style>\n`;
          if(!s.includes('.license-notice{')) s=s.replace('</head>',css+'\n</head>');
          if(!s.includes('data-goatcounter=')){
            const tail=`\n  <script data-goatcounter="https://menadmalek.goatcounter.com/count"\n          async src="//gc.zgo.at/count.js"><\/script>\n\n<div class="license-notice no-print">\n  © 2026 Malek MENAD — Usage personnel gratuit.\n  Usage professionnel ou institutionnel soumis à autorisation préalable.\n  Revente interdite. <a href="LICENSE.txt" target="_blank" rel="noopener">Voir la licence</a>.\n</div>\n`;
            s=s.replace('</body>',tail+'</body>');
          }
          fs.writeFileSync('index.html',s,'utf8');
          NODE
          curl -fsSL https://raw.githubusercontent.com/MenadMalek/Protocole-escalade-/main/LICENSE.txt -o LICENSE.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "MenadMalek"
          git config user.email "malekounou@gmail.com"
          git add index.html LICENSE.txt
          git diff --cached --quiet && exit 0
          git commit -m "Mettre à jour la page d'accueil vers la dernière version"
          git push
